# Subnet Watch at dashboard.reservakit.com (the reservakit server, next to reservakit.com).
# certbot --nginx -d dashboard.reservakit.com adds the TLS server block and the http -> https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.reservakit.com;
    root /var/www/sn-dashboard/public;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
